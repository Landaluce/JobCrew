name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src/job_automation crawler.py events.py cli_ui.py monitor.py playwright_sites.py report_weekly.py crew.py applier.py dashboard.py dashboard_app

      - name: Tests (pytest)
        run: python -m pytest -q
