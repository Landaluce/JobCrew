[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-automation-core"
version = "0.1.0"
description = "Reusable components for resume and job-application automation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Alvaro de Landaluce" }
]
dependencies = []

[project.optional-dependencies]
pdf = [
    "pypdf>=5.0"
]
config = [
    "pyyaml>=6.0"
]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "ruff>=0.9",
    "mypy>=1.14"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", "output", "data", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
